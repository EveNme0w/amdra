[project]
name = "amdra"
version = "0.1.0"
description = "Auditable Multimodal Dispute Resolution Agent: a LangGraph agent for synthetic credit-card disputes"
requires-python = ">=3.10"
dependencies = [
  "langgraph>=0.2",
  "langchain-core>=0.3",
  "langchain-anthropic>=0.3",
  "chromadb>=0.5",
  "pydantic>=2.6",
  "pillow>=10.1",
  "pytesseract>=0.3.10",
  "python-dotenv>=1.0",
  "rank-bm25>=0.2",
  "langgraph-checkpoint-sqlite>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
amdra = "amdra.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amdra"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
